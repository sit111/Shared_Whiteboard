name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "work", "main", "master" ]

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build one-file EXE
        run: pyinstaller --clean --noconfirm --onefile --windowed --name SharedWhiteboard whiteboard_app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharedWhiteboard-exe
          path: dist/SharedWhiteboard.exe
