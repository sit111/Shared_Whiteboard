<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Whiteboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <h1>Shared Whiteboard</h1>
      <label>
        Color
        <input id="colorPicker" type="color" value="#111111" />
      </label>
      <label>
        Size
        <input id="sizePicker" type="range" min="1" max="20" value="3" />
      </label>
      <button id="clearButton" type="button">Clear board</button>
      <span id="status">Connecting...</span>
    </header>
    <canvas id="board" width="1200" height="700" aria-label="Whiteboard canvas"></canvas>
  </main>
  <script src="/app.js"></script>
</body>
</html>
